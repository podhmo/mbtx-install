# MoonBit CI — modeled after podhmo/minigo's go.yml, adapted to the moon
# toolchain. No Makefile dependency.
name: MoonBit

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

# A new push to the same PR cancels the superseded run; pushes to main
# always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (moonbit ${{ matrix.moonbit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # latest: unpinned, catches breakage from new toolchains early.
        # the pinned one is the minimum supported version (floor); bump
        # it deliberately. Pinned versions need the full `X.Y.Z+hash`
        # (see `Compiler version` in core's CHANGELOG.md / `moonc -v`).
        moonbit: [ "latest", "0.10.20+65efd5b93" ]
    steps:
    - uses: actions/checkout@v7

    - name: Install MoonBit
      env:
        MOONBIT_INSTALL_VERSION: ${{ matrix.moonbit }}
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

    - name: MoonBit version
      run: moon version

    - name: Test
      run: |
        if [ -f moon.mod ]; then
          moon update
          moon check
          moon test
        else
          echo "no moon.mod yet — skipping (implementation pending)"
        fi

  e2e-test:
    name: e2e-test (moonbit ${{ matrix.moonbit }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with the test job matrix
        moonbit: [ "latest", "0.10.20+65efd5b93" ]
    steps:
    - uses: actions/checkout@v7

    - name: Install MoonBit
      env:
        MOONBIT_INSTALL_VERSION: ${{ matrix.moonbit }}
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
        echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

    - name: E2E Test
      run: bash e2e/run.sh
